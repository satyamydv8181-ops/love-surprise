<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffe5ef">
<title>A Surprise for POOJA 💗</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;font-family:"Trebuchet MS",Arial,sans-serif;background:linear-gradient(135deg,#ffe0eb,#fff0f5,#ffd6e7);color:#873b5c}
.heart{position:fixed;bottom:-45px;pointer-events:none;opacity:.7;animation:floatUp linear forwards;z-index:0}
@keyframes floatUp{from{transform:translateY(0);opacity:0}15%{opacity:.8}to{transform:translateY(-115vh) rotate(35deg);opacity:0}}
.card{position:relative;z-index:1;width:min(90%,420px);padding:34px 23px;text-align:center;background:#ffffffd1;border:2px solid white;border-radius:30px;box-shadow:0 18px 55px #c35b8533;animation:appear .8s ease-out}
@keyframes appear{from{transform:translateY(20px) scale(.95);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
.teddy{font-size:65px;animation:cuddle 2s ease-in-out infinite}
@keyframes cuddle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) scale(1.05)}}
h1{color:#e34f88;font-size:clamp(27px,7vw,36px);margin:14px 0 8px}
.name{color:#c83e78}.subtitle{line-height:1.6;font-size:16px;margin:12px 0 22px}
.question{font-size:20px;font-weight:bold;margin:24px 0 20px}
.buttons{display:flex;justify-content:center;align-items:center;gap:14px;min-height:55px}
button{border:0;border-radius:50px;padding:13px 24px;font-size:16px;font-weight:bold;font-family:inherit;cursor:pointer;touch-action:manipulation}
#yesBtn{color:white;background:linear-gradient(135deg,#ff70a6,#e94c8a);box-shadow:0 6px 16px #e94c8a40}
#noBtn{color:#a24d70;background:#ffe4ee;border:1px solid #ffc6da;white-space:nowrap}
#result{display:none;margin-top:23px;padding:18px 14px;background:#fff0f6;border-radius:20px;line-height:1.7;animation:appear .5s}
#result h2{margin:0 0 10px;color:#e34f88}.footer{font-size:12px;margin-top:23px;opacity:.75}
.burst{position:fixed;z-index:5;pointer-events:none;animation:burst 1.6s ease-out forwards;font-size:25px}
@keyframes burst{to{transform:translate(var(--x),var(--y)) rotate(45deg) scale(.5);opacity:0}}
@media(max-width:360px){.card{padding:27px 15px}button{padding:12px 18px}.buttons{gap:9px}}
</style>
</head>
<body>
<main class="card">
<div style="letter-spacing:8px">💕 💗 💕</div>
<div class="teddy" aria-hidden="true">🧸💌</div>
<h1>I Love You ❤️</h1>
<p class="subtitle">A tiny little surprise<br>made especially for <strong class="name">POOJA 🤗</strong> 🌷</p>
<div class="question">Do you love me? 🥺💖</div>
<div class="buttons" id="buttonArea">
<button id="yesBtn">Yes 😚</button>
<button id="noBtn">NO 🙂‍↔️</button>
</div>
<section id="result" aria-live="polite">
<h2>Yayyyyy! 🥹💗</h2>
<p>I’m so lucky to have you in my life. ❤️</p>
<p>You make ordinary moments feel special. 🌸 Sending you the biggest virtual hug! 🤗💞</p>
<div style="font-size:30px">💖 🧸 💖</div>
</section>
<div class="footer">Made with love, just for you 💌</div>
</main>
<script>
const yesBtn=document.getElementById('yesBtn'),noBtn=document.getElementById('noBtn'),result=document.getElementById('result'),buttonArea=document.getElementById('buttonArea');
let noMoves=0;
function createHeart(){const h=document.createElement('div');h.className='heart';h.textContent=['💗','💕','💖','🌸','✨'][Math.floor(Math.random()*5)];h.style.left=Math.random()*100+'vw';h.style.fontSize=16+Math.random()*20+'px';h.style.animationDuration=5+Math.random()*5+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),10500)}
setInterval(createHeart,450);
function moveNoButton(){if(result.style.display==='block')return;noMoves++;noBtn.style.position='fixed';noBtn.style.zIndex='10';const m=12,maxX=Math.max(m,innerWidth-noBtn.offsetWidth-m),maxY=Math.max(m,innerHeight-noBtn.offsetHeight-m);let x=m+Math.random()*(maxX-m),y=m+Math.random()*(maxY-m);const r=yesBtn.getBoundingClientRect();for(let i=0;i<12;i++){if(!(x<r.right+25&&x+noBtn.offsetWidth>r.left-25&&y<r.bottom+25&&y+noBtn.offsetHeight>r.top-25))break;x=m+Math.random()*(maxX-m);y=m+Math.random()*(maxY-m)}noBtn.style.left=x+'px';noBtn.style.top=y+'px';noBtn.textContent=noMoves===1?'Hehe, catch me! 🙈':noMoves===3?'Too slow! 😂':noMoves>=5?'Try again! 💗':'NO 🙂‍↔️'}
noBtn.addEventListener('pointerenter',moveNoButton);noBtn.addEventListener('pointerdown',e=>{e.preventDefault();moveNoButton()});noBtn.addEventListener('click',e=>{e.preventDefault();moveNoButton()});
yesBtn.addEventListener('click',()=>{result.style.display='block';buttonArea.style.display='none';noBtn.style.display='none';createBurst();result.scrollIntoView({behavior:'smooth',block:'nearest'})});
function createBurst(){const emojis=['💖','💕','💗','✨','🌸','🥹'];for(let i=0;i<28;i++){const e=document.createElement('div');e.className='burst';e.textContent=emojis[Math.floor(Math.random()*emojis.length)];e.style.left=40+Math.random()*20+'vw';e.style.top=40+Math.random()*20+'vh';e.style.setProperty('--x',Math.random()*360-180+'px');e.style.setProperty('--y',Math.random()*360-180+'px');document.body.appendChild(e);setTimeout(()=>e.remove(),1700)}}
addEventListener('resize',()=>{if(noBtn.style.position==='fixed'){noBtn.style.left=Math.max(12,Math.min(parseFloat(noBtn.style.left)||12,innerWidth-noBtn.offsetWidth-12))+'px';noBtn.style.top=Math.max(12,Math.min(parseFloat(noBtn.style.top)||12,innerHeight-noBtn.offsetHeight-12))+'px'}});
</script>
</body>
</html>
